[package]
name = "woolink"
version = "0.1.0"
edition = "2021"
authors = ["Woolink Team"]
description = "Global Symbol Table for Woo Ecosystem - Cross-package symbol resolution with SoA layout"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }

# Zero-copy serialization with mmap support
rkyv = { version = "0.8", features = ["validation", "mmap", "bytecheck"] }
bytecheck = "0.8"
memmap2 = "0.9"

# Concurrent data structures
dashmap = "5.5"
scc = "2.0"
parking_lot = "0.12"
crossbeam = "0.8"

# Lock-free data structures
crossbeam-epoch = "0.9"
crossbeam-queue = "0.3"

# Immutable data structures for snapshots
im = "15.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Type-safe identifiers
uid = "0.1"

# SIMD support for fast comparison
# portable-atomic = { version = "1.6", features = ["float"] }

# Cache-friendly data structures
# aligned-vec = "0.6"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde", "rng"] }
rayon = "1.8"
indexmap = "2.1"
arc-swap = "1.6"

# For integration with woofind and wootype
woofind = { path = "../woofind" }
wootype = { path = "../wootype" }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.9"

[[bench]]
name = "symbol_table_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
